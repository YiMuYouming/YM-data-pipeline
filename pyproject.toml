[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ym-stock-data"
version = "2.0.0"
description = "弈沐资本 A 股数据平台 — 统一数据获取基座"
requires-python = ">=3.10"
dependencies = [
    "pytdx>=0.3",
    "requests>=2.28",
    "akshare>=1.18",
    "keyring==25.7.0",
]

[project.optional-dependencies]
pywencai = ["pywencai>=0.13", "pandas"]
full = ["pywencai==0.13.1", "pandas", "numpy"]

[project.scripts]
ym-data = "ym_stock_data.__main__:main"

[tool.setuptools.packages.find]
include = ["ym_stock_data", "ym_stock_data.*"]

[tool.setuptools.package-data]
"ym_stock_data.v2" = ["policies/*.json"]
