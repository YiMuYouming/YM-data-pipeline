[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ym-stock-data"
version = "3.0.0"
description = "弈沐资本 A 股数据平台 — 统一数据获取基座"
requires-python = ">=3.10"
dependencies = [
    "pytdx==1.72",
    "requests>=2.28",
    "akshare>=1.18",
    "keyring==25.7.0",
    "httpx2==2.9.1",
    "mcp==2.0.0",
]

[project.optional-dependencies]
pywencai = ["pywencai>=0.13", "pandas"]
full = ["pywencai==0.13.1", "pandas", "numpy"]

[dependency-groups]
dev = ["pyyaml==6.0.3"]

[project.scripts]
ym-data = "ym_stock_data.__main__:main"

[tool.setuptools.packages.find]
include = ["ym_stock_data", "ym_stock_data.*"]

[tool.setuptools.package-data]
"ym_stock_data.v2" = ["policies/*.json"]
"ym_stock_data.providers" = ["stocktoday_methods.v3.json"]
"ym_stock_data.v3" = [
    "stocktoday-probes.v3.json",
    "provider-policy.v3.json",
    "stocktoday-audit-receipt.v3.json",
    "provider-smoke.v3.json",
    "trading-holidays.json",
]
